id = "webframp.shelley"
name = "Shelley"
version = "0.2.3"
min_herdr_version = "0.9.3"
description = "Run Shelley conversations on remote exe.dev VMs as native herdr agents, each in its own workspace with live state and restart resume."
platforms = ["linux", "macos"]

# Runs on `herdr plugin install` only; `plugin link` never builds.
[[build]]
command = ["go", "build", "-o", "shelley-herdr", "."]

[[actions]]
id = "open"
title = "Shelley: open on an exe.dev VM"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "webframp.shelley", "--entrypoint", "picker", "--focus"]

[[panes]]
id = "picker"
title = "Shelley"
placement = "popup"
# Prefer shelley-herdr on PATH (Nix and other package installs); fall back to the
# binary built into the plugin directory by the install step.
command = ["sh", "-c", '''command -v shelley-herdr >/dev/null 2>&1 && exec shelley-herdr pick || exec ./shelley-herdr pick''']
