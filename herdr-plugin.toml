id = "webframp.shelly"
name = "Shelly"
version = "0.1.0"
min_herdr_version = "0.9.0"
platforms = ["linux", "macos"]

# Runs on `herdr plugin install` only; `plugin link` never builds.
[[build]]
command = ["go", "build", "-o", "shelly-herdr", "."]

[[actions]]
id = "open"
title = "Shelley: open on an exe.dev VM"
contexts = ["workspace"]
command = ["herdr", "plugin", "pane", "open", "--plugin", "webframp.shelly", "--entrypoint", "picker", "--focus"]

[[panes]]
id = "picker"
title = "Shelley"
placement = "popup"
# Prefer shelly-herdr on PATH (Nix and other package installs); fall back to the
# binary built into the plugin directory by the install step.
command = ["sh", "-c", '''command -v shelly-herdr >/dev/null 2>&1 && exec shelly-herdr pick || exec ./shelly-herdr pick''']
